version: "2"

run:
  timeout: 5m

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        no-processes:
          files:
            - "**/pkg/dependencies/resolve/lockfile/**"
            - "**/pkg/dependencies/resolve/internal/build/**"
          deny:
            - pkg: os/exec
              desc: lockfile parsing and graph building read untrusted input and must not run processes
            - pkg: syscall
              desc: lockfile parsing and graph building read untrusted input and must not run processes
  exclusions:
    # Do not apply linters to test files.
    paths:
      - _test\.go$

formatters:
  # gci enforces import grouping: stdlib, then third-party, then this module.
  # gofmt here lets `golangci-lint fmt` (make fmt) resolve all formatting at once.
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
