# GoReleaser configuration for the SCANOSS Go CLI.
# Docs: https://goreleaser.com
version: 2

project_name: scanoss

builds:
  - id: scanoss
    main: ./cmd/scanoss-cli
    binary: scanoss-cli
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      # We only ship arm/v7 on Linux; macOS and Windows are amd64/arm64 only.
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/scanoss/scanoss.go/internal/version.version={{ .Tag }}

  # HarmonyOS (OpenHarmony) runs the Linux arm64 binary; published under its own
  # name so users find it. Same artifact as scanoss-cli-linux-arm64.
  - id: harmonyos
    main: ./cmd/scanoss-cli
    binary: scanoss-cli
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/scanoss/scanoss.go/internal/version.version={{ .Tag }}

archives:
  - id: cli
    ids: [scanoss]
    name_template: "scanoss-cli-{{ .Os }}-{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: harmonyos
    ids: [harmonyos]
    name_template: "scanoss-cli-harmonyos-arm64"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

# Unsigned macOS binaries are blocked by Gatekeeper when downloaded through a
# browser. Skipped when the signing secrets are absent (forks, local runs).
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [scanoss]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

dockers_v2:
  - id: scanoss
    ids: [scanoss]
    dockerfile: Dockerfile
    images:
      - ghcr.io/scanoss/scanoss
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: scanoss
      org.opencontainers.image.source: https://github.com/scanoss/scanoss.go
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

release:
  draft: true
  prerelease: false
  # libscanoss shared libraries are built by the reusable build-libscanoss.yml
  # workflow and packaged into ./release-extra before GoReleaser runs.
  extra_files:
    - glob: ./release-extra/*
  footer: |
    ## Install

    **Prebuilt binary:** download the archive for your platform below, extract it,
    and move `scanoss-cli` onto your `PATH`. On Linux (amd64):

    ```bash
    tar xzf scanoss-cli-linux-amd64.tar.gz
    sudo mv scanoss-cli /usr/local/bin/
    ```

    Verify a download against `checksums.txt`:

    ```bash
    sha256sum -c --ignore-missing checksums.txt
    ```

    **Go:**

    ```bash
    go install github.com/scanoss/scanoss.go/cmd/scanoss-cli@latest
    ```

    See the [README](https://github.com/scanoss/scanoss.go/blob/main/README.md) and
    [CLIENT_HELP.md](https://github.com/scanoss/scanoss.go/blob/main/CLIENT_HELP.md)
    to get started.
