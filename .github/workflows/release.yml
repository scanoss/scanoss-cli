name: Release scanoss CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write
  packages: write

jobs:
  # Build the C shared libraries (libscanoss) — attached to the release below.
  build-libscanoss:
    name: Build libscanoss
    uses: ./.github/workflows/build-libscanoss.yml

  release:
    name: Release
    needs: build-libscanoss
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download libscanoss artifacts
        uses: actions/download-artifact@v8
        with:
          path: libscanoss-artifacts
          pattern: libscanoss-*

      - name: Package libscanoss libraries
        run: |
          mkdir -p release-extra
          find libscanoss-artifacts -type f \( -name '*.so' -o -name '*.dylib' \) -exec cp {} release-extra/ \;
          find libscanoss-artifacts -type f -name '*.dll' -exec cp {} release-extra/ \;
          cd release-extra
          for lib in libscanoss-*.so libscanoss-*.dylib; do
            [ -e "$lib" ] || continue
            tar czf "${lib}.tar.gz" "$lib" && rm "$lib"
            sha256sum "${lib}.tar.gz" > "${lib}.tar.gz.sha256"
          done
          for lib in libscanoss-*.dll; do
            [ -e "$lib" ] || continue
            zip -q "${lib}.zip" "$lib" && rm "$lib"
            sha256sum "${lib}.zip" > "${lib}.zip.sha256"
          done
          ls -lh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

  test-release-binaries:
    name: Test Release Binaries
    needs: release
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGNED: ${{ secrets.MACOS_SIGN_P12 != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: scanoss-cli-linux-amd64.tar.gz
          - os: macos-latest
            archive: scanoss-cli-darwin-arm64.tar.gz
          - os: windows-latest
            archive: scanoss-cli-windows-amd64.zip
    steps:
      - name: Download release archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "${{ matrix.archive }}" --dir .

      - name: Extract and test (Unix)
        if: runner.os != 'Windows'
        run: |
          tar xzf "${{ matrix.archive }}"
          chmod +x scanoss-cli
          ./scanoss-cli --version
          ./scanoss-cli --help

      # The download is not quarantined, so the smoke test above runs even unsigned.
      - name: Verify Developer ID signature (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        run: |
          codesign --verify --strict --verbose=2 scanoss-cli
          codesign -dvv scanoss-cli 2>&1 | grep -q '^Authority=Developer ID Application'

      - name: Extract and test (Windows)
        if: runner.os == 'Windows'
        run: |
          Expand-Archive -Path "${{ matrix.archive }}" -DestinationPath .
          .\scanoss-cli.exe --version
          .\scanoss-cli.exe --help
